name: tests

on:
  push:
    branches: [main]
  pull_request:

# A push to a branch that already has a run in flight cancels it, but a run on
# main does not: main's history is what a release is cut from, so its results
# have to be complete rather than merely recent.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Runners are pinned to ubuntu-24.04, not ubuntu-latest: the label moves to
# Ubuntu 26 on 2026-10-19, and a test matrix should change image when someone
# decides to, in a commit that says so -- not in the middle of a release.
env:
  DEBIAN_FRONTEND: noninteractive
  # Pinned, and built from source by .github/actions/libpqxx rather than taken
  # from apt. This project targets the current libpqxx and uses its current
  # spelling -- exec(sql, pqxx::params), which 7.9 introduced -- so whatever
  # version a runner happens to package is not a supported input. release.yml
  # pins the same version for the same reason; keep the two in step.
  PQXX_VERSION: 8.0.2
  PQXX_SHA256: 028c5fba4982e759fe182af1103ccd08b02bb4e1f9f12a551e01d21cac0c4440

jobs:
  # Compile each distinct configuration ONCE and hand the binary to the jobs
  # that run it.
  #
  # There are four configurations and eleven test jobs, and compiling per job
  # spent most of the runner time re-deriving the same four binaries: the seven
  # database jobs differ only in the server they talk to and the compiler that
  # produced them, not in anything that has to be built again per PostgreSQL
  # major. This is pg_licht's arrangement, adopted here for the same reason.
  #
  # libpqxx is linked statically, so an artifact needs nothing at run time
  # beyond libpq.
  build:
    name: build-${{ matrix.config }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both compilers, because they disagree about -Wconversion around the
          # OpenSSL C boundary and about dangling references. -Werror is on
          # everywhere, so a disagreement is a build failure rather than a
          # warning nobody reads. pg_laswell links OpenSSL directly, which is
          # the boundary they disagree at.
          #
          # The two plain builds carry NO module: they are what proves core is
          # PostgreSQL-only. The two sanitizer builds carry the Citus module,
          # because the released package does (one package, every module), so
          # the code that ships is the code ASan, UBSan and TSan watch. Without
          # a cluster its live cases skip; its planner tests and every core
          # test still run.
          - config: plain-gcc
            compiler: g++
            sanitizer: NONE
            modules: ''
            tools: true
          - config: plain-clang
            compiler: clang++
            sanitizer: NONE
            modules: ''
            tools: false
          - config: address-undefined
            compiler: g++
            sanitizer: ADDRESS_UNDEFINED
            modules: citus;pg_cron;pgvector;timescaledb
            tools: false
          # THREAD is a gate for this project rather than belt-and-braces: a
          # worker thread per job plus one process-wide observer against a
          # shared registry is real concurrency, not a theoretical possibility.
          - config: thread
            compiler: g++
            sanitizer: THREAD
            modules: citus;pg_cron;pgvector;timescaledb
            tools: false

    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update -o DPkg::Lock::Timeout=300
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build libpq-dev nlohmann-json3-dev \
            libgtest-dev libssl-dev mandoc postgresql-client
      - name: Build libpqxx from source, not from apt
        uses: ./.github/actions/libpqxx
        with:
          version: ${{ env.PQXX_VERSION }}
          sha256: ${{ env.PQXX_SHA256 }}
          compiler: ${{ matrix.compiler }}

      - name: Configure
        run: |
          cmake -S cpp -B build -DPGLASWELL_WERROR=ON -G Ninja \
            -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} \
            -DPGLASWELL_SANITIZER=${{ matrix.sanitizer }} \
            "-DPGLASWELL_MODULES=${{ matrix.modules }}"
      - name: Build the test binary
        run: cmake --build build --target pg_laswell_mcp_test
      - name: Build the shipped binaries and the plan renderer
        if: matrix.tools
        run: cmake --build build --target pg_laswell pg_laswell_mcp render_plan

      # Neither needs a database nor varies by PostgreSQL version, so they run
      # ONCE here rather than seven times downstream. They also need the build
      # tree rather than a bare binary, which is the other reason they belong
      # here: mandoc lints the two man pages, no_dangling_items reads the
      # source, and plans drives render_plan against committed transcripts.
      - name: Lint the manuals, and check the source and plan transcripts
        if: matrix.tools
        run: ctest --test-dir build -R 'manpage_lint|no_dangling_items|plans' --output-on-failure

      - uses: actions/upload-artifact@v7
        with:
          name: test-binary-${{ matrix.config }}
          path: build/pg_laswell_mcp_test
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: matrix.tools
        with:
          name: tools-plain
          path: |
            build/pg_laswell
            build/pg_laswell_mcp
          retention-days: 1
          if-no-files-found: error

  # The suite against each supported server. One binary per compiler, five
  # servers, no rebuilding.
  test:
    name: ${{ matrix.config }} / PostgreSQL ${{ matrix.pg }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {config: plain-gcc,   pg: 16}
          - {config: plain-gcc,   pg: 17}
          - {config: plain-gcc,   pg: 18}
          # PostgreSQL 15 has no EXPLAIN (GENERIC_PLAN), so listMigrations
          # cannot derive relations hidden in expressions and says so. One job
          # covers that degraded path; running the whole matrix on it would
          # test the same fallback five times.
          - {config: plain-gcc,   pg: 15}
          - {config: plain-clang, pg: 16}
          - {config: plain-clang, pg: 17}
          - {config: plain-clang, pg: 18}
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports: ['5432:5432']
    steps:
      # The suite shells out to psql to install the ledger, and reads
      # sql/bootstrap.sql through a path baked in at compile time, so the source
      # tree has to be present even though nothing here is compiled.
      - uses: actions/checkout@v7
      - name: Install runtime dependencies
        run: |
          sudo apt-get update -o DPkg::Lock::Timeout=300
          sudo apt-get install -y --no-install-recommends libpq5 postgresql-client
      - uses: actions/download-artifact@v8
        with:
          name: test-binary-${{ matrix.config }}
          path: build
      - name: Run the suite
        working-directory: build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          # A skip nobody notices is a test that silently stopped running.
          PGLASWELL_REQUIRE_DATABASE: '1'
        run: |
          chmod +x pg_laswell_mcp_test   # artifacts do not preserve the mode bit
          ./pg_laswell_mcp_test

  sanitizers:
    name: ${{ matrix.config }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        config: [address-undefined, thread]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports: ['5432:5432']
    steps:
      - uses: actions/checkout@v7
      - name: Install runtime dependencies
        run: |
          sudo apt-get update -o DPkg::Lock::Timeout=300
          sudo apt-get install -y --no-install-recommends libpq5 postgresql-client
      - uses: actions/download-artifact@v8
        with:
          name: test-binary-${{ matrix.config }}
          path: build
      - name: Run the suite
        working-directory: build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          PGLASWELL_REQUIRE_DATABASE: '1'
          ASAN_OPTIONS: abort_on_error=1:detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          chmod +x pg_laswell_mcp_test
          ./pg_laswell_mcp_test

  # Valgrind covers what a sanitizer build cannot run under, and the OpenSSL
  # EVP handle lifetimes are the one place with manual C resource management.
  valgrind:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # Sharded because it ran serially for 12 minutes while every other job had
    # been finished for ten of them, and it is embarrassingly parallel: four
    # tests were 43% of it, one of them 149s on its own. gtest's own
    # --gtest_shard_index splits by test, so coverage is identical to one
    # process -- the union of the shards is the same filtered set -- and the
    # total compute is unchanged. Only the wall clock moves, down to roughly
    # the slowest single test.
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    name: valgrind (${{ matrix.shard }})
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports: ['5432:5432']
    steps:
      - uses: actions/checkout@v7
      - name: Install runtime dependencies
        run: |
          sudo apt-get update -o DPkg::Lock::Timeout=300
          sudo apt-get install -y --no-install-recommends libpq5 valgrind postgresql-client
      - uses: actions/download-artifact@v8
        with:
          name: test-binary-plain-gcc
          path: build
      - name: Run the suite under Valgrind
        working-directory: build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          PGLASWELL_REQUIRE_DATABASE: '1'
        run: |
          chmod +x pg_laswell_mcp_test
          # The exclusions come from the same file cpp/cmake/SafetyFlags.cmake
          # reads, so a local `ctest -R valgrind` and this job cover exactly the
          # same tests. The file says why each is excluded.
          EXCL="$GITHUB_WORKSPACE/cpp/test/valgrind-slow-tests.txt"
          NAMES="$(grep -vE '^\s*(#|$)' "$EXCL" | paste -sd:)"
          # Guarded because a silently empty list is worse than a missing one:
          # it would leave the filter meaning "exclude nothing" while still
          # printing a plausible command line, so the exclusions would rot
          # unnoticed. Same reasoning as the FATAL_ERROR in SafetyFlags.cmake.
          test -n "$NAMES" || { echo "::error::$EXCL listed no tests"; exit 1; }
          FILTER="-$NAMES"
          echo "gtest filter: $FILTER"
          # strategy.job-total is the matrix length, so adding or removing a
          # shard above needs no edit here. Hardcoding 4 would silently drop
          # tests the day the matrix changed: a shard count larger than
          # GTEST_TOTAL_SHARDS means the extra shards run nothing, and a
          # smaller one means the tail is never run at all -- in both cases
          # every job still passes.
          GTEST_TOTAL_SHARDS=${{ strategy.job-total }} \
          GTEST_SHARD_INDEX=${{ matrix.shard }} \
          valgrind --error-exitcode=99 --leak-check=full --track-origins=yes \
            ./pg_laswell_mcp_test "--gtest_filter=$FILTER"

  # --call is the one caller that is neither an agent nor a person, and the exit
  # code is the whole point of it. Runs once: it does not vary by server major.
  call_mode:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports: ['5432:5432']
    steps:
      - uses: actions/checkout@v7
      - name: Install runtime dependencies
        run: |
          sudo apt-get update -o DPkg::Lock::Timeout=300
          sudo apt-get install -y --no-install-recommends libpq5 postgresql-client
      - uses: actions/download-artifact@v8
        with:
          name: tools-plain
          path: build
      - name: The --call contract, at the process level
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          chmod +x build/pg_laswell_mcp build/pg_laswell
          bash cpp/test/call-mode.sh ./build/pg_laswell_mcp

  # Logical replication needs a publisher and a subscriber, so the script builds
  # two clusters with initdb and throws them away. Server binaries, not a
  # service container.
  replication:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install runtime dependencies
        run: |
          sudo apt-get update -o DPkg::Lock::Timeout=300
          sudo apt-get install -y --no-install-recommends libpq5 postgresql postgresql-client
      # No artifact: this script drives psql against two clusters it builds
      # itself, asserting that the SQL pg_laswell EMITS is accepted by a real
      # publisher and subscriber. It never runs the binary.
      - name: Two clusters, a publication and a subscription
        run: bash cpp/test/replication-tests.sh

  # The executor refuses to run behind a transaction-mode pooler. This asserts
  # that the refusal HAPPENS -- not that the incompatibility is absent.
  pooled:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports: ['5432:5432']
    steps:
      - uses: actions/checkout@v7
      - name: Install runtime dependencies
        run: |
          sudo apt-get update -o DPkg::Lock::Timeout=300
          sudo apt-get install -y --no-install-recommends libpq5 pgbouncer postgresql-client
      - uses: actions/download-artifact@v8
        with:
          name: tools-plain
          path: build
      - name: Read-only tools work through a pooler
        run: |
          chmod +x build/pg_laswell_mcp build/pg_laswell
          bash cpp/test/run-pooled-tests.sh ./build/pg_laswell_mcp

  # Independent of the fan-out: a package is built from a Release tree with
  # testing off, which is a different configuration from any of the four above.
  packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update -o DPkg::Lock::Timeout=300
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build libpq-dev nlohmann-json3-dev \
            libssl-dev rpm file
      - name: Build libpqxx from source, not from apt
        uses: ./.github/actions/libpqxx
        with:
          version: ${{ env.PQXX_VERSION }}
          sha256: ${{ env.PQXX_SHA256 }}
      - name: Build packages
        run: |
          cmake -S cpp -B build -DPGLASWELL_WERROR=ON -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          # BOTH binaries: the install rules name both, so cpack fails on a tree
          # where only one was built -- and a package missing the deployment
          # binary would not be noticed until somebody tried to deploy with it.
          cmake --build build --target pg_laswell pg_laswell_mcp
          cd build && cpack -G DEB && cpack -G RPM && cpack -G TGZ
      # What reached the binaries, read from the ELF, on the same Release
      # configuration the release builds -- the test jobs build without a
      # build type, where _FORTIFY_SOURCE does not apply.
      - name: Both binaries carry the hardening that was asked for
        run: bash cpp/test/hardening-check.sh build/pg_laswell build/pg_laswell_mcp
      - name: The package must carry both binaries, both manuals and bootstrap.sql
        shell: bash
        run: |
          set -euo pipefail
          cd build
          # Captured once and then grepped, rather than piped into `grep -q`
          # five times: grep -q exits at the first match and closes the pipe,
          # which kills dpkg-deb with SIGPIPE. It passed anyway only because
          # the default shell sets no pipefail -- and this step now does.
          LIST=$(dpkg-deb -c ./*.deb)
          for want in bin/pg_laswell bin/pg_laswell_mcp \
                      man1/pg_laswell.1 man1/pg_laswell_mcp.1 \
                      share/pg_laswell/bootstrap.sql; do
            printf '%s\n' "$LIST" | grep -q "$want" || {
              echo "::error::$want is missing from the package"; exit 1; }
          done
          # Shipped alongside the binary precisely because the binary must
          # never run it: an owner of laswell.trusted_key can grant itself
          # trust.
          dpkg-deb -f ./*.deb Depends | grep -q libpq5
          printf '%s\n' "$LIST"

      # Inspecting metadata is not evidence that a package works, and this job
      # used to stop at inspecting it. The check above is the one this project
      # has already watched pass on a package whose binary died at exec with
      # "libpqxx-7.10.so: cannot open shared object file" -- a wrong Depends
      # line still contains the string it is grepped for. release.yml learned
      # to install and run; that only happens on a tag, so every ordinary push
      # kept the weaker gate. Same evidence, every push.
      - name: Install the package and run both binaries
        shell: bash
        run: |
          set -euo pipefail
          cd build
          sudo apt-get install -y --no-install-recommends ./*.deb
          # Static libpqxx is the whole point of building it from source, and a
          # silent fall back to a shared copy produces a package that installs
          # and then cannot start. Asserted where it is actually visible.
          for b in pg_laswell pg_laswell_mcp; do
            LINKED=$(objdump -p "$(command -v $b)")
            printf '%s\n' "$LINKED" | grep NEEDED || true
            if printf '%s\n' "$LINKED" | grep -q 'pqxx'; then
              echo "::error::libpqxx was linked dynamically into $b"
              exit 1
            fi
          done
          # getSpecDigest needs no database and still exercises loading, the
          # canonicaliser and OpenSSL -- the three things that break when a
          # package is wrong about its dependencies.
          SPEC='{"spec":{"laswell_spec_version":1,"id":"x","description":"d","intents":[{"kind":"add_column","schema":"s","table":"t","column":"c","type":"text","nullable":true,"comment":"c"}]}}'
          pg_laswell_mcp --version
          OUT=$(pg_laswell_mcp --call getSpecDigest --args "$SPEC")
          printf '%s\n' "$OUT" | grep -q '"digest"' || {
            echo "::error::the installed binary did not answer: $OUT"; exit 1; }
          pg_laswell --version
          # And the documented exit code, from the installed binary rather than
          # from the build tree: 3 is "a configuration problem", which is what
          # no --repo is.
          set +e; pg_laswell >/dev/null 2>&1; rc=$?; set -e
          [ "$rc" -eq 3 ] || {
            echo "::error::pg_laswell with no --repo exited $rc, expected 3"; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: |
            build/*.deb
            build/*.rpm
            build/*.tar.gz
          retention-days: 7

  # One check to require in branch protection, instead of twenty-one.
  #
  # Required checks are matched by NAME, and half of these names are matrix
  # coordinates: "valgrind (2)" exists because that job is sharded four ways,
  # and it was sharded differently last week. Requiring them individually makes
  # protection depend on how a job happens to be split today -- rename or
  # re-shard one and every merge blocks on a check that will never report
  # again, which looks exactly like a hung CI.
  #
  # This depends on all of them and does nothing, so the list lives here, in
  # the file that defines the jobs, rather than in a settings page nobody reads
  # beside them. `always()` with an explicit result check, not the default: a
  # needs: job is SKIPPED when a dependency fails, and a skipped required check
  # is not a failing one -- protection would let the merge through.
  # One database NAME on two servers is two databases, and the grouping logic
  # grants concurrency across databases with NO evidence -- so that case is the
  # one place a wrong answer costs something. It cannot be expressed inside a
  # single cluster, where names are unique, so it gets two.
  #
  # Its own job rather than a second service on all seven matrix jobs. Those run
  # the whole suite, paced backfills included, and the executor guards itself
  # with idle_in_transaction_session_timeout = commit_interval_ms * 3 -- putting
  # a second database on a two-core runner is how a paced commit starts losing
  # its connection, which is exactly what one of them then did.
  twin_clusters:
    name: twin clusters
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports: ['5432:5432']
      # Same image, separate initdb, so the system_identifiers genuinely differ.
      postgres_second:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports: ['5433:5432']
    steps:
      - uses: actions/checkout@v7
      - name: Install runtime dependencies
        run: |
          sudo apt-get update -o DPkg::Lock::Timeout=300
          sudo apt-get install -y --no-install-recommends libpq5 postgresql-client
      - uses: actions/download-artifact@v8
        with:
          name: test-binary-plain-gcc
          path: build
      - name: One name on two servers
        working-directory: build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          PGLASWELL_SECOND_CLUSTER_URL: postgresql://postgres:postgres@localhost:5433/postgres
          PGLASWELL_REQUIRE_DATABASE: '1'
          # This job exists for this test. A skip here is the job doing nothing.
          PGLASWELL_REQUIRE_SECOND_CLUSTER: '1'
        run: |
          chmod +x pg_laswell_mcp_test   # artifacts do not preserve the mode bit
          ./pg_laswell_mcp_test --gtest_filter='TwinNamedDatabaseTest.*'

  # The ledger schema upgrade, against the PREVIOUS release's own bootstrap
  # rather than a copy of its DDL. A fixture that has to be kept in step with a
  # file in the same repository is a fixture that will quietly stop standing
  # for it, and the one thing this has to prove is that a ledger written by the
  # previous release upgrades without losing history.
  #
  # fetch-depth: 0 because the script reads that script out of git.
  ledger_upgrade:
    name: ledger upgrade
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports: ['5432:5432']
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install runtime dependencies
        run: |
          sudo apt-get update -o DPkg::Lock::Timeout=300
          sudo apt-get install -y --no-install-recommends postgresql-client
      - name: A version 2 ledger upgrades to version 3
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: sh cpp/test/upgrade-tests.sh

  # The worked examples, which until now nothing but a person ever ran.
  #
  # They earn a job because they have already found FOUR things the 416-test
  # suite did not: an empty directory passing silently against a populated
  # ledger, a summary line saying "databases" while counting connections, a
  # helper sending stderr to /dev/null so a hard failure became an empty log,
  # and an example that had stopped demonstrating its own point. They find those
  # because they drive the BINARY end to end, against real clusters, in the
  # arrangements the landing page sells -- and the page links to them from its
  # first screen, so a directory that has stopped working is worse than none.
  #
  # docker compose, NOT service containers, and the reason is worth keeping.
  # Service containers looked cheaper: lib.sh already takes its ports from the
  # environment. But a service container cannot be given a custom command, and
  # the replication example needs wal_level=logical -- which ALTER SYSTEM cannot
  # deliver because it takes a restart, and a service container cannot be
  # restarted from the job. Tried it; got `wal_level=replica` three times and a
  # failure. compose sets it in the file, which is also the one definition of
  # the topology a developer already runs.
  examples:
    name: examples
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Install runtime dependencies
        run: |
          sudo apt-get update -o DPkg::Lock::Timeout=300
          sudo apt-get install -y --no-install-recommends libpq5 postgresql-client openssl
      # tools-plain, NOT test-binary-*: the examples need the two SHIPPED
      # binaries, because they sign with pg_laswell_mcp and apply with
      # pg_laswell, and that split is the thing the tool exists to keep. The
      # test artifact carries pg_laswell_mcp_test and neither of them, which is
      # how this job first failed on `chmod: cannot access build/pg_laswell`.
      - uses: actions/download-artifact@v8
        with:
          name: tools-plain
          path: build
      - name: Start the three clusters
        run: |
          docker compose -f examples/docker/compose.yml up -d
          for i in $(seq 1 60); do
            ok=0
            for c in laswell_alpha laswell_beta laswell_gamma; do
              docker exec "$c" pg_isready -U postgres -d app -q 2>/dev/null && ok=$((ok+1))
            done
            [ "$ok" = 3 ] && break
            sleep 2
          done
          # Asserted, not assumed: this is the setting the replication example
          # needs and the one a service container could not provide.
          for port in 55432 55433 55434; do
            got=$(PGPASSWORD=laswell psql -h 127.0.0.1 -p $port -U postgres -d app -t -A -c "SHOW wal_level")
            echo "127.0.0.1:$port wal_level=$got"
            [ "$got" = "logical" ] || { echo "::error::wal_level is $got on $port"; exit 1; }
          done
      - name: Every example
        env:
          PG_LASWELL: ${{ github.workspace }}/build/pg_laswell
          PG_LASWELL_MCP: ${{ github.workspace }}/build/pg_laswell_mcp
          # compose resolves container names, so the subscriber dials `alpha`
          # exactly as it does on a developer's machine.
          PUBLISHER_HOST: alpha
        run: |
          chmod +x build/pg_laswell build/pg_laswell_mcp
          ./examples/docker/run-all.sh
      - name: The logs of anything that failed
        if: failure()
        run: |
          for f in examples/docker/.*.log; do
            [ -e "$f" ] || continue
            echo "::group::$f"; cat "$f"; echo "::endgroup::"
          done
      - name: Stop the clusters
        if: always()
        run: docker compose -f examples/docker/compose.yml down -v

  # The Citus module, built and run against a real three-node cluster.
  #
  # Its own build, because a module is a compile-time choice: the plain
  # artifacts carry no citus_* kinds and no Citus reading, so nothing downstream
  # of `build` can exercise any of this. Two things only this job proves:
  #
  #   - the purity check with a module ENABLED. planner_purity_check.cpp covers
  #     modules/*/plan.h through planner.h, but only a module the build turned
  #     on -- and no other job turns one on.
  #   - the module against Citus. Its refusals are unit-tested against fixed
  #     readings, which proves the decision and nothing about whether Citus
  #     plans and runs the SQL. That gap cost real defects: a dry run that
  #     could not verify a reference-table walk, and citus_distribute_function
  #     reporting every function "already distributed" while routing nothing.
  citus:
    name: citus
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update -o DPkg::Lock::Timeout=300
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build libpq-dev nlohmann-json3-dev \
            libgtest-dev libssl-dev mandoc postgresql-client openssl
      - name: Build libpqxx from source, not from apt
        uses: ./.github/actions/libpqxx
        with:
          version: ${{ env.PQXX_VERSION }}
          sha256: ${{ env.PQXX_SHA256 }}
      - name: Configure with the citus module
        run: cmake -S cpp -B build -DPGLASWELL_WERROR=ON -G Ninja "-DPGLASWELL_MODULES=citus;pg_cron;pgvector;timescaledb"
      - name: Build everything
        run: cmake --build build
      - name: The binary says which modules it carries
        run: |
          ./build/pg_laswell_mcp --version | tee /dev/stderr | grep -q '^modules: citus,pg_cron,pgvector,timescaledb$'
      - name: The suite that needs no database, with the module in it
        run: ./build/pg_laswell_mcp_test
      - name: Manuals, source checks and plan transcripts, with the module in it
        run: ctest --test-dir build -R 'manpage_lint|manpage_kinds|no_dangling_items|plans' --output-on-failure
      - name: Start the Citus cluster
        run: |
          docker compose -f examples/docker/citus/compose.yml up -d
          for i in $(seq 1 90); do
            ok=0
            for c in laswell_citus_coordinator laswell_citus_worker1 laswell_citus_worker2; do
              docker exec "$c" pg_isready -U postgres -d app -q 2>/dev/null && ok=$((ok+1))
            done
            [ "$ok" = 3 ] && break
            sleep 2
          done
          [ "$ok" = 3 ] || { echo "::error::the Citus cluster did not come up"; exit 1; }
      # The example first: it builds the database the tests then run in -- the
      # extension on every node, the workers registered in THAT database
      # (pg_dist_node is per database), the ledger, and the example's specs
      # applied. So the example is exercised, and the tests start from a state
      # someone following the example would actually have.
      - name: The Citus example
        env:
          PG_LASWELL: ${{ github.workspace }}/build/pg_laswell
          PG_LASWELL_MCP: ${{ github.workspace }}/build/pg_laswell_mcp
          PGPASSWORD: laswell
        run: ./examples/docker/citus/run.sh
      - name: The module against Citus
        env:
          CITUS_URL: postgresql://postgres:laswell@127.0.0.1:55440/citus_example
        run: |
          ctest --test-dir build -R citus_tests --output-on-failure
          # The suite's own live cases -- the observer's SQL against a real wait,
          # which no fixed reading can prove. They skip without CITUS_URL, so the
          # no-database run above cannot have covered them.
          ./build/pg_laswell_mcp_test --gtest_filter='CitusLive.*'
          ./build/pg_laswell_mcp_test --gtest_filter='CitusLive.*' | grep -q 'PASSED.*1 test' \
            || { echo "::error::a CitusLive test was skipped or failed"; exit 1; }
      - name: Stop the cluster
        if: always()
        run: docker compose -f examples/docker/citus/compose.yml down -v

  # pg_cron and pgvector, against PostgreSQL with both extensions: two servers,
  # because pg_cron is kept two ways -- in a maintenance database, jobs for the
  # application scheduled from there, or in the application database itself --
  # and the module supports both. The modules' refusals are unit-tested in the
  # citus job's build already; this proves what only a server can:
  #
  #   - every refusal pre-empts an error the server REALLY raises. The refused
  #     statement is run by hand as well and must fail with the message the
  #     refusal quotes, so an extension release that lifts a limit fails here;
  #   - what is not refused is accepted -- the dry run executes it;
  #   - the example applies one set of signed specifications to both layouts,
  #     and the reading that runs for every plan does not break a role that
  #     cannot read cron.database_name (measured: it needs pg_read_all_settings).
  extensions:
    name: extensions
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update -o DPkg::Lock::Timeout=300
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build libpq-dev nlohmann-json3-dev \
            libgtest-dev libssl-dev mandoc postgresql-client openssl
      - name: Build libpqxx from source, not from apt
        uses: ./.github/actions/libpqxx
        with:
          version: ${{ env.PQXX_VERSION }}
          sha256: ${{ env.PQXX_SHA256 }}
      - name: Configure with every module
        run: cmake -S cpp -B build -DPGLASWELL_WERROR=ON -G Ninja "-DPGLASWELL_MODULES=citus;pg_cron;pgvector;timescaledb"
      - name: Build the binaries
        run: cmake --build build --target pg_laswell pg_laswell_mcp
      - name: Start PostgreSQL with pg_cron and pgvector
        run: |
          docker compose -f examples/docker/extensions/compose.yml up -d --build
          for i in $(seq 1 90); do
            ok=0
            for c in laswell_cron_central laswell_cron_local; do
              docker exec "$c" pg_isready -U postgres -d app -q 2>/dev/null && ok=$((ok+1))
            done
            [ "$ok" = 2 ] && break
            sleep 2
          done
          [ "$ok" = 2 ] || { echo "::error::the extension servers did not come up"; exit 1; }
      - name: The extensions example, both layouts
        env:
          PG_LASWELL: ${{ github.workspace }}/build/pg_laswell
          PG_LASWELL_MCP: ${{ github.workspace }}/build/pg_laswell_mcp
          PGPASSWORD: laswell
        run: |
          ./examples/docker/extensions/run.sh | tee example.log
          grep -q 'repository : 0 pending' example.log \
            || { echo "::error::the second run had something to do"; exit 1; }
          # The ledger-backed advisory: a job edited by hand, noticed on a plan
          # for something else entirely.
          grep -q 'changed by hand since' example.log \
            || { echo "::error::the hand-edited job was not noticed"; exit 1; }
      - name: The modules against the servers
        env:
          EXT_CENTRAL_URL: postgresql://postgres:laswell@127.0.0.1:55450
          EXT_LOCAL_URL: postgresql://postgres:laswell@127.0.0.1:55451
        run: |
          ./cpp/test/extensions-tests.sh build/pg_laswell build/pg_laswell_mcp | tee ext.log
          grep -q ', 0 failed' ext.log || exit 1
          ! grep -q '^SKIP' ext.log || { echo "::error::the live tests skipped"; exit 1; }
      - name: Stop the servers
        if: always()
        run: docker compose -f examples/docker/extensions/compose.yml down -v

  # TimescaleDB, against both editions and the oldest supported line: the
  # Timescale License build, the Apache build (-oss, what PGDG and Debian
  # package), and 2.28.3 on PostgreSQL 15. Proves what only a server can:
  #
  #   - every refusal pre-empts an error the server really raises, the refused
  #     statement run by hand and required to fail with the quoted message;
  #   - the index SQL the planner emits for a hypertable -- one chunk at a time,
  #     never CONCURRENTLY -- is taken out of the plan and run, because a
  #     per-chunk build cannot run in the dry run's transaction;
  #   - the example applies one repository to both editions, the Timescale
  #     License specs held on the Apache server by their epoch.
  timescaledb:
    name: timescaledb
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update -o DPkg::Lock::Timeout=300
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build libpq-dev nlohmann-json3-dev \
            libgtest-dev libssl-dev mandoc postgresql-client openssl
      - name: Build libpqxx from source, not from apt
        uses: ./.github/actions/libpqxx
        with:
          version: ${{ env.PQXX_VERSION }}
          sha256: ${{ env.PQXX_SHA256 }}
      - name: Configure with every module
        run: cmake -S cpp -B build -DPGLASWELL_WERROR=ON -G Ninja "-DPGLASWELL_MODULES=citus;pg_cron;pgvector;timescaledb"
      - name: Build the binaries
        run: cmake --build build --target pg_laswell pg_laswell_mcp
      - name: Start TimescaleDB, both editions and the oldest line
        run: |
          docker compose -f examples/docker/timescale/compose.yml up -d
          for i in $(seq 1 90); do
            ok=0
            for c in laswell_ts_tsl laswell_ts_apache laswell_ts_oldest; do
              docker exec "$c" pg_isready -U postgres -d app -q 2>/dev/null && ok=$((ok+1))
            done
            [ "$ok" = 3 ] && break
            sleep 2
          done
          [ "$ok" = 3 ] || { echo "::error::the TimescaleDB servers did not come up"; exit 1; }
      - name: The TimescaleDB example, both editions
        env:
          PG_LASWELL: ${{ github.workspace }}/build/pg_laswell
          PG_LASWELL_MCP: ${{ github.workspace }}/build/pg_laswell_mcp
          PGPASSWORD: laswell
        run: |
          ./examples/docker/timescale/run.sh | tee example.log
          grep -q 'held_for_epoch' example.log \
            || { echo "::error::the Apache server should hold the Timescale License specs"; exit 1; }
          grep -q 'timescaledb.transaction_per_chunk' example.log \
            || { echo "::error::the large hypertable's index was not planned per chunk"; exit 1; }
          [ "$(grep -c 'repository : 0 pending' example.log)" = 2 ] \
            || { echo "::error::the second run had something to do"; exit 1; }
      - name: The module against the servers
        env:
          TS_TSL_URL: postgresql://postgres:laswell@127.0.0.1:55470
          TS_APACHE_URL: postgresql://postgres:laswell@127.0.0.1:55471
          TS_OLDEST_URL: postgresql://postgres:laswell@127.0.0.1:55472
        run: |
          ./cpp/test/timescaledb-tests.sh build/pg_laswell build/pg_laswell_mcp | tee ts.log
          grep -q ', 0 failed' ts.log || exit 1
          ! grep -q '^SKIP' ts.log || { echo "::error::the live tests skipped"; exit 1; }
      - name: Stop the servers
        if: always()
        run: docker compose -f examples/docker/timescale/compose.yml down -v

  # FreeBSD 15, in a VM on a Linux runner (GitHub has no FreeBSD runners):
  # built with every module, the suite that needs no database run, then
  # PACKAGED, installed with pkg add, and both binaries run -- the same script
  # release.yml uses, so the package is proven on every pull request rather
  # than first on a tag. The pgshard lab ran FreeBSD guests 92 times without
  # once exercising this build, because there was no package to install.
  freebsd:
    name: freebsd
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Build, test, package and install on FreeBSD 15
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15.1"
          envs: 'PQXX_VERSION PQXX_SHA256'
          usesh: true
          run: sh .github/scripts/freebsd-build.sh pg_laswell-freebsd15-amd64 tests

  # macOS, built with every module and the suite that needs no database.
  #
  # The first macOS compile in this project's life happened on a release tag,
  # and failed: libc++ deprecates char_traits<T> for non-character T, so a
  # bytea read as std::basic_string<std::byte> stopped -Werror at the first
  # instantiation (fixed with pqxx::bytes). Nothing in this workflow would have
  # caught it, because every job here is Linux and libstdc++. This one is, and
  # it builds what release.yml's macOS target builds -- Apple clang, libc++,
  # Homebrew's libpq and OpenSSL 3 -- before a tag is pushed rather than after.
  # No database: the database jobs above already cover the server side.
  macos:
    name: macos
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # The same dependencies, and for the same reasons, as release.yml's macOS
      # step: Apple ships LibreSSL headers, which are not a drop-in for
      # Ed25519 EVP_DigestVerify, so OpenSSL 3 is named explicitly.
      - name: Install dependencies
        run: |
          brew install cmake ninja libpq nlohmann-json pkg-config openssl@3 googletest mandoc
          echo "PKG_CONFIG_PATH=$(brew --prefix libpq)/lib/pkgconfig:/usr/local/lib/pkgconfig" >> $GITHUB_ENV
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> $GITHUB_ENV
      - name: Build libpqxx from source
        run: |
          sh .github/scripts/build-libpqxx.sh \
            "${PQXX_VERSION}" "${PQXX_SHA256}" "" \
            -DCMAKE_PREFIX_PATH="$(brew --prefix libpq)"
      - name: Configure with every module
        run: |
          cmake -S cpp -B build -DPGLASWELL_WERROR=ON -G Ninja \
            "-DPGLASWELL_MODULES=citus;pg_cron;pgvector;timescaledb" \
            -DCMAKE_PREFIX_PATH="$(brew --prefix libpq);$(brew --prefix googletest)"
      - name: Build everything
        run: cmake --build build
      - name: The binary says which modules it carries
        run: |
          ./build/pg_laswell_mcp --version | tee /dev/stderr | grep -q '^modules: citus,pg_cron,pgvector,timescaledb$'
      - name: The suite that needs no database
        run: ./build/pg_laswell_mcp_test
      - name: Manuals and source checks
        run: ctest --test-dir build -R 'manpage_lint|manpage_kinds|no_dangling_items|plans' --output-on-failure

  ci-ok:
    name: ci-ok
    if: always()
    needs:
      - build
      - test
      - sanitizers
      - valgrind
      - call_mode
      - replication
      - pooled
      - twin_clusters
      - ledger_upgrade
      - examples
      - citus
      - extensions
      - timescaledb
      - freebsd
      - macos
      - packages
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job must have succeeded
        run: |
          echo "results: ${{ join(needs.*.result, ', ') }}"
          for r in ${{ join(needs.*.result, ' ') }}; do
            [ "$r" = "success" ] || { echo "::error::a required job reported $r"; exit 1; }
          done
          echo "all green"
