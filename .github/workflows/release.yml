name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'tag to build (must already exist)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false   # never cancel a release mid-upload

env:
  DEBIAN_FRONTEND: noninteractive
  # Pinned, and built statically from source on every target, rather than
  # linking whatever libpqxx each platform happens to package. This is
  # pg_licht's method, and it is the reason pg_licht's packages work.
  #
  # What the alternative actually produced, measured rather than assumed:
  # building against Debian's shared libpqxx-7.10 leaves the binary with a
  # NEEDED entry for libpqxx-7.10.so -- a soname no RPM distribution provides,
  # and one that pins the deb to a single Debian release. libpq stays dynamic on
  # purpose: its C ABI is stable across versions and platforms patch it
  # independently, so it should come from the target's own repository.
  PQXX_VERSION: 8.0.2

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container || '' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Tarballs for distributions with no package here. "Portable" only
          # within limits worth stating: each is built on the runner's own
          # glibc (ubuntu-latest, currently 24.04) and glibc is
          # backward-compatible, not forward -- so a tarball runs on that
          # release and newer, and will not run on an older one. The deb and
          # rpm below exist because a tarball can declare no dependency at all;
          # anyone on an older glibc should build from source.
          - os: ubuntu-latest
            artifact: pg_laswell-linux-x86_64
            distro: ubuntu
            extension: tar.gz
          - os: ubuntu-24.04-arm
            artifact: pg_laswell-linux-arm64
            distro: ubuntu
            extension: tar.gz
          - os: ubuntu-latest
            container: debian:trixie
            artifact: pg_laswell-linux-x86_64-debian13
            distro: debian
            extension: deb
          - os: ubuntu-24.04-arm
            container: debian:trixie
            artifact: pg_laswell-linux-arm64-debian13
            distro: debian
            extension: deb
          - os: ubuntu-latest
            container: rockylinux:9
            artifact: pg_laswell-linux-x86_64-rocky9
            distro: rocky
            extension: rpm
          - os: ubuntu-24.04-arm
            container: rockylinux:9
            artifact: pg_laswell-linux-arm64-rocky9
            distro: rocky
            extension: rpm
          # GitHub's macos-latest is Apple silicon. There is no x86_64 macOS
          # target: the runners for it are being retired, and Rosetta runs the
          # arm64 binary anyway.
          - os: macos-latest
            artifact: pg_laswell-macos-arm64
            distro: macos
            extension: tar.gz

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # `file` is not optional on Debian: without it CPack refuses outright --
      # "file utility is not available. CPACK_DEBIAN_PACKAGE_SHLIBDEPS ... not
      # available" -- and produces no package at all. A minimal container lacks
      # it, and the failure names a variable rather than a missing program.
      - name: Install dependencies (Debian)
        if: matrix.distro == 'debian'
        run: |
          apt-get update -q
          apt-get install -y --no-install-recommends \
            curl ca-certificates cmake build-essential pkg-config dpkg-dev file \
            binutils libpq-dev libssl-dev nlohmann-json3-dev
          curl -fsSL "https://github.com/jtv/libpqxx/archive/refs/tags/${PQXX_VERSION}.tar.gz" | tar -xz -C /tmp
          cmake -S "/tmp/libpqxx-${PQXX_VERSION}" -B /tmp/libpqxx-build \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DSKIP_BUILD_TEST=ON
          cmake --build /tmp/libpqxx-build -j"$(nproc)"
          cmake --install /tmp/libpqxx-build
          echo "PKG_CONFIG_PATH=/usr/local/lib/pkgconfig" >> $GITHUB_ENV

      - name: Install dependencies (Ubuntu)
        if: matrix.distro == 'ubuntu'
        run: |
          sudo apt-get update -o DPkg::Lock::Timeout=300 -q
          sudo apt-get install -y --no-install-recommends \
            cmake build-essential pkg-config file binutils \
            curl ca-certificates libpq-dev libssl-dev nlohmann-json3-dev
          curl -fsSL "https://github.com/jtv/libpqxx/archive/refs/tags/${PQXX_VERSION}.tar.gz" | tar -xz -C /tmp
          cmake -S "/tmp/libpqxx-${PQXX_VERSION}" -B /tmp/libpqxx-build \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DSKIP_BUILD_TEST=ON
          cmake --build /tmp/libpqxx-build -j"$(nproc)"
          sudo cmake --install /tmp/libpqxx-build
          echo "PKG_CONFIG_PATH=/usr/local/lib/pkgconfig" >> $GITHUB_ENV

      - name: Install dependencies (Rocky Linux)
        if: matrix.distro == 'rocky'
        run: |
          dnf install -y epel-release dnf-plugins-core
          dnf config-manager --set-enabled crb
          dnf install -y https://download.postgresql.org/pub/repos/yum/reporpms/EL-9-$(uname -m)/pgdg-redhat-repo-latest.noarch.rpm
          dnf module disable -y postgresql
          # Rocky 9's default gcc-c++ is GCC 11, which cannot build this at all
          # (C++23) and lacks the complete <format> that libpqxx 8.x needs.
          # gcc-toolset-13 is Rocky's own AppStream package for a newer GCC
          # without replacing the system compiler.
          #
          # PGDG's "libpq-devel" on RHEL/Rocky resolves to the *versioned*
          # postgresql18-devel, which installs libpq.pc under /usr/pgsql-18/lib
          # and never on pkg-config's default search path. libpq5-devel is
          # PGDG's separate unversioned package that installs to the standard
          # FHS location instead.
          #
          # curl is deliberately absent: rockylinux:9 ships curl-minimal, which
          # already provides the binary and CONFLICTS with the curl package.
          dnf install -y cmake gcc-toolset-13-gcc-c++ binutils libpq5-devel \
            openssl-devel nlohmann-json-devel pkg-config rpm-build tar gzip
          echo "CC=/opt/rh/gcc-toolset-13/root/usr/bin/gcc" >> $GITHUB_ENV
          echo "CXX=/opt/rh/gcc-toolset-13/root/usr/bin/g++" >> $GITHUB_ENV
          export CC=/opt/rh/gcc-toolset-13/root/usr/bin/gcc
          export CXX=/opt/rh/gcc-toolset-13/root/usr/bin/g++
          curl -fsSL "https://github.com/jtv/libpqxx/archive/refs/tags/${PQXX_VERSION}.tar.gz" | tar -xz -C /tmp
          cmake -S "/tmp/libpqxx-${PQXX_VERSION}" -B /tmp/libpqxx-build \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DSKIP_BUILD_TEST=ON
          cmake --build /tmp/libpqxx-build -j"$(nproc)"
          cmake --install /tmp/libpqxx-build
          echo "PKG_CONFIG_PATH=/usr/local/lib/pkgconfig" >> $GITHUB_ENV

      # macOS needs OpenSSL explicitly, which pg_licht never did: Apple ships
      # only LibreSSL headers, and they are not a drop-in for EVP_DigestVerify
      # over Ed25519. OPENSSL_ROOT_DIR is required because CMake finds Apple's
      # copy first and would configure against headers the link then rejects.
      - name: Install dependencies (macOS)
        if: matrix.distro == 'macos'
        run: |
          brew install cmake libpq nlohmann-json pkg-config openssl@3
          echo "PKG_CONFIG_PATH=$(brew --prefix libpq)/lib/pkgconfig:/usr/local/lib/pkgconfig" >> $GITHUB_ENV
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> $GITHUB_ENV
          curl -fsSL "https://github.com/jtv/libpqxx/archive/refs/tags/${PQXX_VERSION}.tar.gz" | tar -xz -C /tmp
          cmake -S "/tmp/libpqxx-${PQXX_VERSION}" -B /tmp/libpqxx-build \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DSKIP_BUILD_TEST=ON \
            -DCMAKE_PREFIX_PATH="$(brew --prefix libpq)"
          cmake --build /tmp/libpqxx-build -j"$(sysctl -n hw.ncpu)"
          sudo cmake --install /tmp/libpqxx-build

      # The tag is the source of truth for the version. A tag that disagrees
      # with the project() version means one of them is wrong, and shipping
      # either would make the ledger's record of which binary ran unreliable.
      #
      # A pre-release tag carries a suffix -- v0.1.0-alpha0 -- and only the
      # numeric part is compared. That is not a convenience: project(VERSION)
      # accepts nothing but numbers, so the suffix CANNOT live in CMakeLists
      # and the two could never be string-equal. The suffix is what marks the
      # GitHub release as a pre-release, in the publish job below.
      - name: The tag must match the project version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          # Shape checked before it is taken apart. Without this a typo like
          # "v0.1.0-" or "v1.2" still splits into something that compares
          # equal, and the first sign of trouble would be a published release
          # named after the typo -- which is not something a tag can take back.
          echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' || {
            echo "::error::tag $TAG is not vMAJOR.MINOR.PATCH[-PRERELEASE]"
            exit 1
          }
          VERSION="${TAG#v}"
          WANT="${VERSION%%-*}"
          HAVE=$(grep -oE 'project\(pg_laswell_mcp VERSION [0-9.]+' cpp/CMakeLists.txt | grep -oE '[0-9.]+$')
          echo "tag=$VERSION  numeric=$WANT  CMakeLists=$HAVE"
          [ "$WANT" = "$HAVE" ] || {
            echo "::error::tag $TAG does not match project version $HAVE"
            exit 1
          }

      - name: Build
        run: |
          cmake -S cpp -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          # BOTH binaries. The install rules name both, so a tree with only one
          # built either fails packaging or -- worse -- produces a package that
          # installs and has nothing to deploy with, which nobody would discover
          # until a release night.
          cmake --build build --target pg_laswell pg_laswell_mcp
          strip build/pg_laswell build/pg_laswell_mcp

      # Static libpqxx is the entire point of the source build above, and a
      # silent fall back to the platform's shared copy would produce a package
      # that installs and then cannot start. Assert it where it is actually
      # visible: the linker's own record.
      - name: libpqxx must be linked statically
        run: |
          # Both binaries link it, so both are checked: they are separate link
          # lines and only one of them being static would ship a package that
          # installs and then cannot start.
          for b in pg_laswell pg_laswell_mcp; do
            if [ "${{ matrix.distro }}" = "macos" ]; then
              otool -L "build/$b"
              LINKED=$(otool -L "build/$b")
            else
              objdump -p "build/$b" | grep NEEDED
              LINKED=$(objdump -p "build/$b")
            fi
            if grep -q 'pqxx' <<<"$LINKED"; then
              echo "::error::libpqxx was linked dynamically into $b; the source build did not take effect"
              exit 1
            fi
          done

      - name: Package (tar.gz)
        if: matrix.extension == 'tar.gz'
        env:
          # BSD tar on macOS otherwise stores AppleDouble (._*) sidecars for
          # extended attributes, which show up as junk on extraction.
          COPYFILE_DISABLE: "1"
        run: |
          rm -rf stage
          # Staged through the install rules rather than tarred from the build
          # tree, so the archive carries the same bin/ + share/ layout the deb
          # and rpm get.
          cmake --install build --prefix "$PWD/stage"
          tar -czf ${{ matrix.artifact }}.tar.gz -C stage bin share
          tar -tzf ${{ matrix.artifact }}.tar.gz | sort

      - name: Package (deb)
        if: matrix.extension == 'deb'
        run: |
          cd build && cpack -G DEB
          dpkg-deb -f ./*.deb Depends
          # CPack names every package "-Linux" regardless of architecture, so
          # x86_64 and arm64 would arrive at the release as the same filename
          # and one would silently overwrite the other.
          mv pg-laswell-*.deb ../${{ matrix.artifact }}.deb

      - name: Package (rpm)
        if: matrix.extension == 'rpm'
        run: |
          cd build && cpack -G RPM
          rpm -qp --requires ./*.rpm | grep -vE 'rpmlib|GLIBC|CXXABI|GLIBCXX|GCC_'
          mv pg-laswell-*.rpm ../${{ matrix.artifact }}.rpm

      # The listing is captured ONCE and then grepped, rather than piped into
      # `grep -q` three times. `grep -q` exits at the first match and closes the
      # pipe, which kills dpkg-deb's tar subprocess with SIGPIPE -- so a passing
      # check printed "dpkg-deb: error: tar subprocess was killed by signal
      # (Broken pipe)", and passed only because Actions' default shell does not
      # set pipefail. Capturing first makes the check quiet, and makes pipefail
      # safe to turn on, which is what catches a listing command that fails
      # outright rather than merely matching nothing.
      - name: The package must carry both binaries, both manuals and bootstrap.sql
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.extension }}" in
            deb)
              LIST=$(dpkg-deb -c ${{ matrix.artifact }}.deb)
              DEPS=$(dpkg-deb -f ${{ matrix.artifact }}.deb Depends) ;;
            rpm)
              # rpmbuild gzips man pages, so the shipped name ends .1.gz --
              # which the substring below still matches.
              LIST=$(rpm -qlp ${{ matrix.artifact }}.rpm)
              DEPS=$(rpm -qp --requires ${{ matrix.artifact }}.rpm) ;;
            tar.gz)
              LIST=$(tar tzf ${{ matrix.artifact }}.tar.gz)
              DEPS="" ;;
          esac
          for want in bin/pg_laswell bin/pg_laswell_mcp \
                      man1/pg_laswell.1 man1/pg_laswell_mcp.1 \
                      share/pg_laswell/bootstrap.sql; do
            grep -q "$want" <<<"$LIST" || {
              echo "::error::$want is missing from the package"; exit 1; }
          done
          # Dependencies are derived, so this asserts that generation RAN, not
          # what it produced: pinning the exact list here would be the same
          # mistake as pinning it in CMakeLists.
          case "${{ matrix.extension }}" in
            deb) grep -q 'libpq5'     <<<"$DEPS" || { echo "::error::no derived Depends"; exit 1; } ;;
            rpm) grep -q 'libpq.so.5' <<<"$DEPS" || { echo "::error::no derived Requires"; exit 1; } ;;
          esac
          echo "$LIST"

      # Inspecting metadata is not evidence that a package works.
      #
      # The gate this joins used to be the ONLY packaging check, and it passed
      # on a package whose binary died at exec with "libpqxx-7.10.so: cannot
      # open shared object file" -- because a wrong Depends line still contains
      # the string it was grepped for. So install it and run it. getSpecDigest
      # is the right probe: it needs no database, and it still exercises
      # loading, the canonicaliser and OpenSSL.
      - name: Install the package and run the binary
        run: |
          SPEC='{"spec":{"laswell_spec_version":1,"id":"x","description":"d","intents":[{"kind":"add_column","schema":"s","table":"t","column":"c","type":"text","nullable":true,"comment":"c"}]}}'
          case "${{ matrix.extension }}" in
            deb) apt-get install -y --no-install-recommends ./${{ matrix.artifact }}.deb
                 BIN=pg_laswell_mcp; DEPLOY=pg_laswell ;;
            rpm) dnf install -y ./${{ matrix.artifact }}.rpm
                 BIN=pg_laswell_mcp; DEPLOY=pg_laswell ;;
            tar.gz)
                 rm -rf verify && mkdir verify
                 tar xzf ${{ matrix.artifact }}.tar.gz -C verify
                 BIN="$PWD/verify/bin/pg_laswell_mcp"
                 DEPLOY="$PWD/verify/bin/pg_laswell" ;;
          esac
          "$BIN" --version
          OUT=$("$BIN" --call getSpecDigest --args "$SPEC")
          grep -q '"digest"' <<<"$OUT" || {
            echo "::error::the installed binary did not answer: $OUT"; exit 1; }
          # The deployment binary too. --version is the right probe for it for
          # the same reason getSpecDigest is for the server: it needs no
          # database, and it still proves the thing loads and its dynamic
          # dependencies resolve.
          "$DEPLOY" --version
          # And that it refuses correctly rather than merely starting: no
          # --repo is a configuration problem, which is exit 3.
          set +e; "$DEPLOY" >/dev/null 2>&1; rc=$?; set -e
          [ "$rc" = "3" ] || {
            echo "::error::pg_laswell with no --repo exited $rc, expected 3"; exit 1; }
          echo "both binaries unpacked from the release artifact, and answered"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.${{ matrix.extension }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # CHANGES.md must carry the version being released. A release whose
      # changelog does not mention it is a release nobody can read afterwards,
      # which is the same failure the ledger exists to prevent in the database.
      # Matched on the numeric part, so v0.1.0-alpha0 and the v0.1.0 that
      # eventually follows it read the same entry. A pre-release is a build of
      # a version, not a version of its own, and asking for a separate heading
      # per alpha would leave the changelog describing the build process
      # instead of the changes.
      - name: CHANGES.md must mention this version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          NUMERIC="${VERSION%%-*}"
          grep -q "## $NUMERIC" CHANGES.md || {
            echo "::error::CHANGES.md has no entry for $NUMERIC"
            exit 1
          }

      # Every target must have arrived. fail-fast is off so one platform's
      # failure does not cancel the others, which means a partial release is
      # exactly what would otherwise get published -- silently, and looking
      # complete.
      - name: All seven artifacts must be present
        run: |
          missing=0
          for f in pg_laswell-linux-x86_64.tar.gz \
                   pg_laswell-linux-arm64.tar.gz \
                   pg_laswell-linux-x86_64-debian13.deb \
                   pg_laswell-linux-arm64-debian13.deb \
                   pg_laswell-linux-x86_64-rocky9.rpm \
                   pg_laswell-linux-arm64-rocky9.rpm \
                   pg_laswell-macos-arm64.tar.gz; do
            [ -f "dist/$f" ] || { echo "::error::missing artifact $f"; missing=1; }
          done
          ls -l dist
          exit $missing

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      # Idempotent on a re-run: an existing release is uploaded to rather than
      # failing, so a transient upload error can simply be retried.
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          # A suffix on the tag is the whole signal. Without --prerelease a
          # test build becomes the repository's "Latest" and is what anyone
          # arriving at the page downloads, which is the opposite of what an
          # alpha is for.
          case "${TAG#v}" in
            *-*) PRERELEASE=--prerelease ;;
            *)   PRERELEASE= ;;
          esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            # Re-asserted on a re-run: the upload branch would otherwise leave
            # a release created by hand, or before this flag existed, marked
            # as the latest one. Written as an if rather than
            # `[ -n "$X" ] && cmd`, which returns 1 when the test is false and
            # would fail the step on every stable re-release, since it is the
            # last command the branch runs.
            if [ -n "$PRERELEASE" ]; then
              gh release edit "$TAG" $PRERELEASE
            fi
          else
            gh release create "$TAG" dist/* \
              --title "$TAG" --generate-notes $PRERELEASE
          fi
